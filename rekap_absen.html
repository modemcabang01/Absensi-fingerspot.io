<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fingerspot Rekap Lite by Himawari-hub (januar - gorontalo)</title>
    <!-- Tailwind CSS untuk Styling UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- xlsx-js-style untuk Ekspor Excel + Support WrapText & Auto Row Height -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <style>
        .sticky-col-left {
            position: sticky;
            left: 0;
            z-index: 20;
        }
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 30;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Header & Card Upload -->
        <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 border-b pb-4">
                <div>
                    <div class="flex items-center gap-2 mb-1">
                        <span class="bg-indigo-100 text-indigo-800 text-xs font-semibold px-2.5 py-0.5 rounded border border-indigo-200">
                            Fingerspot Rekap Lite by Himawari-hub (januar - gorontalo)
                        </span>
                    </div>
                    <h1 class="text-2xl font-bold text-slate-900">Rekapitulasi Absensi Pegawai</h1>
                    <p class="text-sm text-slate-500">Upload file Excel laporan scan/absensi untuk merangkum jam masuk/keluar pegawai per tanggal.</p>
                </div>
                <button id="exportBtn" onclick="exportToExcel()" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-medium shadow flex items-center gap-2 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Export Rekap ke Excel
                </button>
            </div>

            <!-- Form Upload File -->
            <div class="grid grid-cols-1 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase mb-1 text-slate-600">Pilih File Excel Absensi Fingerspot (.xlsx / .xls)</label>
                    <input type="file" id="excelFile" accept=".xlsx, .xls" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 border border-slate-300 rounded-lg cursor-pointer bg-slate-50">
                </div>
            </div>

            <!-- Filter Tanggal & Nama -->
            <div id="filterSection" class="hidden grid grid-cols-1 md:grid-cols-3 gap-4 mt-4 pt-4 border-t border-slate-100">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tanggal Mulai</label>
                    <input type="date" id="startDate" onchange="renderTable()" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tanggal Akhir</label>
                    <input type="date" id="endDate" onchange="renderTable()" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Cari Nama Pegawai</label>
                    <input type="text" id="searchName" oninput="renderTable()" placeholder="Ketik nama pegawai..." class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>
        </div>

        <!-- Section Tabel Rekap -->
        <div id="resultCard" class="hidden bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
            <div class="p-4 bg-slate-50 border-b flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                <div>
                    <span id="officeDisplay" class="text-base font-bold text-indigo-900 block"></span>
                    <span id="summaryText" class="text-xs font-medium text-slate-500"></span>
                </div>
                
                <!-- Legend Warna -->
                <div class="flex items-center gap-3 text-xs bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm">
                    <span class="font-semibold text-slate-600">Keterangan:</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-red-500 inline-block"></span> 0 Scan (Kosong)</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block"></span> 1 Scan</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-indigo-500 inline-block"></span> ≥ 2 Scan</span>
                </div>
            </div>
            
            <div class="overflow-x-auto max-h-[600px] overflow-y-auto">
                <table id="rekapTable" class="w-full text-left text-xs border-collapse">
                    <thead id="tableHead" class="bg-slate-800 text-white sticky-header">
                        <!-- Dynamic Header -->
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-200">
                        <!-- Dynamic Body -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let rawData = [];
        let allDates = [];
        let allEmployees = [];
        let groupedData = {};
        let detectedOfficeName = '';

        document.getElementById('excelFile').addEventListener('change', handleFile, false);

        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                const json = XLSX.utils.sheet_to_json(worksheet, { defval: '' });
                processData(json);
            };
            reader.readAsArrayBuffer(file);
        }

        function processData(data) {
            rawData = [];
            groupedData = {};
            detectedOfficeName = '';
            let datesSet = new Set();
            let employeesSet = new Set();
            let officeSet = new Set();

            data.forEach(row => {
                const nama = (row['Nama'] || row['NAMA'] || row['Name'] || row['Nama Pegawai'] || '').toString().trim();
                const tgl = (row['Tanggal Absensi'] || row['Tanggal'] || row['TANGGAL'] || row['Date'] || '').toString().trim();
                const jam = (row['Jam Absensi'] || row['Jam'] || row['JAM'] || row['Time'] || '').toString().trim();
                
                // Ambil Nama Kantor dari Kolom "Kantor"
                const kantor = (row['Kantor'] || row['KANTOR'] || row['Office'] || row['OFFICE'] || row['Perusahaan'] || row['Departemen'] || '').toString().trim();
                if (kantor) {
                    officeSet.add(kantor);
                }

                if (nama && tgl && jam) {
                    let formattedDate = tgl;
                    if (tgl.includes('/')) {
                        const parts = tgl.split('/');
                        if (parts[2] && parts[2].length === 4) formattedDate = `${parts[2]}-${parts[0].padStart(2,'0')}-${parts[1].padStart(2,'0')}`;
                    }

                    let formattedJam = jam.substr(0, 5);

                    datesSet.add(formattedDate);
                    employeesSet.add(nama);

                    if (!groupedData[nama]) groupedData[nama] = {};
                    if (!groupedData[nama][formattedDate]) groupedData[nama][formattedDate] = [];
                    
                    if (!groupedData[nama][formattedDate].includes(formattedJam)) {
                        groupedData[nama][formattedDate].push(formattedJam);
                    }
                }
            });

            if (officeSet.size > 0) {
                detectedOfficeName = Array.from(officeSet).join(', ');
            }

            allDates = Array.from(datesSet).sort();
            allEmployees = Array.from(employeesSet).sort();

            for (let emp in groupedData) {
                for (let date in groupedData[emp]) {
                    groupedData[emp][date].sort();
                }
            }

            if (allDates.length > 0) {
                document.getElementById('startDate').value = allDates[0];
                document.getElementById('endDate').value = allDates[allDates.length - 1];
            }

            document.getElementById('filterSection').classList.remove('hidden');
            document.getElementById('resultCard').classList.remove('hidden');
            document.getElementById('exportBtn').classList.remove('hidden');

            renderTable();
        }

        function getFilteredData() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const filterName = document.getElementById('searchName').value.toLowerCase();

            const filteredDates = allDates.filter(d => (!startDate || d >= startDate) && (!endDate || d <= endDate));
            const filteredEmployees = allEmployees.filter(emp => emp.toLowerCase().includes(filterName));

            return { filteredDates, filteredEmployees };
        }

        function renderTable() {
            const { filteredDates, filteredEmployees } = getFilteredData();

            document.getElementById('officeDisplay').innerText = detectedOfficeName ? `Kantor / Instansi: ${detectedOfficeName}` : 'Laporan Rekap Absensi';

            // Render Header
            const thead = document.getElementById('tableHead');
            let headerHTML = `<tr>
                <th class="p-3 border-r border-slate-700 min-w-[50px] text-center sticky-col-left bg-slate-800">No</th>
                <th class="p-3 border-r border-slate-700 min-w-[180px] sticky-col-left bg-slate-800" style="left: 50px;">Nama Pegawai</th>`;
            
            filteredDates.forEach(date => {
                const dParts = date.split('-');
                const displayDate = dParts.length === 3 ? `${dParts[2]}/${dParts[1]}` : date;
                headerHTML += `<th class="p-3 border-r border-slate-700 text-center min-w-[110px]">${displayDate}</th>`;
            });
            headerHTML += `</tr>`;
            thead.innerHTML = headerHTML;

            // Render Body
            const tbody = document.getElementById('tableBody');
            let bodyHTML = '';

            filteredEmployees.forEach((emp, index) => {
                // Alternating row background (Zebra Striping)
                const isEven = index % 2 === 0;
                const rowBgClass = isEven ? 'bg-white' : 'bg-slate-50';
                const stickyBgClass = isEven ? 'bg-white' : 'bg-slate-100';

                bodyHTML += `<tr class="${rowBgClass} hover:bg-indigo-50/40 border-b transition-colors">
                    <td class="p-2.5 border-r text-center font-medium sticky-col-left ${stickyBgClass}">${index + 1}</td>
                    <td class="p-2.5 border-r font-semibold text-slate-800 sticky-col-left ${stickyBgClass}" style="left: 50px;">${emp}</td>`;
                
                filteredDates.forEach(date => {
                    const jamList = (groupedData[emp] && groupedData[emp][date]) ? groupedData[emp][date] : [];
                    
                    if (jamList.length === 0) {
                        // MERAH: Tidak ada absen sama sekali
                        bodyHTML += `<td class="p-2 border-r text-center align-middle bg-red-50/80 text-red-600 font-bold border-red-100">-</td>`;
                    } else if (jamList.length === 1) {
                        // KUNING: Hanya 1 absen
                        const formattedBadge = `<span class="inline-block bg-amber-100 text-amber-900 font-semibold px-2 py-0.5 rounded border border-amber-300 text-[11px]">${jamList[0]}</span>`;
                        bodyHTML += `<td class="p-2 border-r text-center align-top bg-amber-50/60 border-amber-100">${formattedBadge}</td>`;
                    } else {
                        // LENGKAP (>=2 scan): Indigo / Normal
                        const formattedBadge = jamList.map(j => `<span class="inline-block bg-indigo-50 text-indigo-700 font-medium px-1.5 py-0.5 rounded border border-indigo-200 text-[11px] m-0.5">${j}</span>`).join(' ');
                        bodyHTML += `<td class="p-2 border-r text-center align-top">${formattedBadge}</td>`;
                    }
                });

                bodyHTML += `</tr>`;
            });

            tbody.innerHTML = bodyHTML;
            document.getElementById('summaryText').innerText = `Menampilkan ${filteredEmployees.length} pegawai untuk periode (${filteredDates.length} hari)`;
        }

        // Fitur Export Excel
        function exportToExcel() {
            const { filteredDates, filteredEmployees } = getFilteredData();
            
            const excelRows = [];
            const rowHeights = [];

            // 1. Header Kantor
            if (detectedOfficeName) {
                excelRows.push([`KANTOR / INSTANSI: ${detectedOfficeName.toUpperCase()}`]);
                rowHeights.push({ hpt: 20 });
                excelRows.push([]); 
                rowHeights.push({ hpt: 10 });
            }

            // 2. Baris Judul Tabel
            const headerRow = ["No", "Nama Pegawai"];
            filteredDates.forEach(date => {
                const dParts = date.split('-');
                const displayDate = dParts.length === 3 ? `${dParts[2]}/${dParts[1]}/${dParts[0]}` : date;
                headerRow.push(displayDate);
            });
            excelRows.push(headerRow);
            rowHeights.push({ hpt: 25 });

            const startDataRowIndex = detectedOfficeName ? 3 : 1;

            // 3. Isi Data Pegawai dan Jam Absen
            filteredEmployees.forEach((emp, index) => {
                const row = [index + 1, emp];
                let maxLinesInRow = 1;

                filteredDates.forEach(date => {
                    const jamList = (groupedData[emp] && groupedData[emp][date]) ? groupedData[emp][date] : [];
                    if (jamList.length > 0) {
                        row.push(jamList.join('\n'));
                        if (jamList.length > maxLinesInRow) {
                            maxLinesInRow = jamList.length;
                        }
                    } else {
                        row.push('-');
                    }
                });

                excelRows.push(row);
                rowHeights.push({ hpt: 18 + ((maxLinesInRow - 1) * 14) });
            });

            // 4. Buat WorkSheet
            const worksheet = XLSX.utils.aoa_to_sheet(excelRows);
            worksheet['!rows'] = rowHeights;

            // 5. Styling Sel Excel (Baris Belang + Warna Merah/Kuning pada Sel Absen)
            const range = XLSX.utils.decode_range(worksheet['!ref']);
            for (let R = range.s.r; R <= range.e.r; ++R) {
                const dataRowIdx = R - startDataRowIndex;
                const isEvenDataRow = dataRowIdx % 2 === 0;

                for (let C = range.s.c; C <= range.e.c; ++C) {
                    const cellAddress = XLSX.utils.encode_cell({ r: R, c: C });
                    if (!worksheet[cellAddress]) continue;

                    worksheet[cellAddress].t = 's';
                    if (!worksheet[cellAddress].s) worksheet[cellAddress].s = {};

                    // Header Nama Kantor
                    if (detectedOfficeName && R === 0) {
                        worksheet[cellAddress].s = {
                            font: { bold: true, size: 12, color: { rgb: "1E293B" } },
                            alignment: { horizontal: "left", vertical: "center" }
                        };
                        continue;
                    }

                    // Header Kolom Tabel
                    if (R === (startDataRowIndex - 1)) {
                        worksheet[cellAddress].s = {
                            font: { bold: true, color: { rgb: "FFFFFF" } },
                            fill: { fgColor: { rgb: "1E293B" } },
                            alignment: { horizontal: "center", vertical: "center", wrapText: true }
                        };
                    } else if (R >= startDataRowIndex) {
                        // Warna dasar selang-seling (zebra striping) untuk kolom No & Nama
                        let cellFillColor = isEvenDataRow ? "FFFFFF" : "F8FAFC";
                        let fontColor = "0F172A";
                        let isBold = false;

                        // Jika kolom tanggal (C >= 2)
                        if (C >= 2) {
                            const val = (worksheet[cellAddress].v || '').toString();
                            if (val === '-') {
                                // MERAH: 0 Scan
                                cellFillColor = "FEE2E2"; // Light Red
                                fontColor = "DC2626";     // Red Text
                                isBold = true;
                            } else if (!val.includes('\n')) {
                                // KUNING: 1 Scan saja (tidak ada newline)
                                cellFillColor = "FEF3C7"; // Light Amber/Yellow
                                fontColor = "92400E";     // Dark Amber Text
                                isBold = true;
                            }
                        }

                        worksheet[cellAddress].s = {
                            font: { bold: isBold, color: { rgb: fontColor } },
                            fill: { fgColor: { rgb: cellFillColor } },
                            alignment: { 
                                horizontal: C >= 2 ? "center" : (C === 0 ? "center" : "left"), 
                                vertical: C >= 2 && worksheet[cellAddress].v === '-' ? "center" : "top", 
                                wrapText: true 
                            }
                        };
                    }
                }
            }

            // Lebar Kolom
            const colWidths = [{ wch: 6 }, { wch: 25 }];
            filteredDates.forEach(() => colWidths.push({ wch: 14 }));
            worksheet['!cols'] = colWidths;

            // 6. Simpan File Excel
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Rekap Absensi");

            const todayStr = new Date().toISOString().slice(0, 10);
            const safeOfficeName = detectedOfficeName ? detectedOfficeName.replace(/[^a-zA-Z0-9]/g, '_') : 'Kantor';
            XLSX.writeFile(workbook, `Rekap_Absensi_${safeOfficeName}_${todayStr}.xlsx`);
        }
    </script>
</body>
</html>
